<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Overwatch API</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.typekit.net/iyq4brx.css">
    <script src="script.js" defer></script>
</head>

<body>
<div class="logo"> 
<img src="images/overwatch-logo-white-15.png" alt="">
</div>   

<H1>Hall of Heroes</H1>

<p id="info">Search or click on the portraits to learn more about the heroes that make up Overwatch</p>

    <input
  id="search"
  type="search"
  placeholder="Search Overwatch heroes..."
/>

<select id="roleFilter">
  <option value="all">All roles</option>
  <option value="tank">Tank</option>
  <option value="damage">Damage</option>
  <option value="support">Support</option>
</select>




<nav id="alphabet"></nav>

<p id="heroCount"></p>

<section id="heroGallery"></section>

<dialog id="heroModal">
  <button id="closeModal" type="button">X</button>
  <div id="modalContent"></div>
</dialog>


    <footer>
        Created by <a href="https://github.com/RevEm9/Project1OverwatchDynamicData/tree/main">Emily Revell</a> in the context of Systems Design in the Interaction Design
        program at Sheridan College 2026 Fall Semester. Overwatch Hero data via <a href="https://overfast-api.tekrop.fr"> Overfast API </a>
    </footer>

</body>

</html>
